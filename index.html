<style>
/* ══════════════════════════════════════════════════════════════════
   🎯 NOUVELLES FONCTIONNALITÉS QR + GPS TRACKING + AVIS
   ══════════════════════════════════════════════════════════════════ */

/* QR CODE & LIVRAISON */
.qr-validation-section{display:flex;gap:12px;margin:16px 0;flex-wrap:wrap;}
.btn-qr{background:rgba(0,230,118,.1);border:1px solid rgba(0,230,118,.3);color:var(--gr);padding:10px 16px;border-radius:8px;font-size:12px;font-weight:700;cursor:pointer;transition:all .2s;display:inline-flex;align-items:center;gap:6px;}
.btn-qr:hover{background:rgba(0,230,118,.2);border-color:var(--gr);}
.btn-qr.delivery{background:rgba(0,153,255,.1);border:1px solid rgba(0,153,255,.3);color:var(--bl);}
.btn-qr.delivery:hover{background:rgba(0,153,255,.2);border-color:var(--bl);}
.btn-qr.photo{background:rgba(255,179,0,.1);border:1px solid rgba(255,179,0,.3);color:var(--yw);}
.btn-qr.photo:hover{background:rgba(255,179,0,.2);border-color:var(--yw);}

/* QR MODAL */
.qr-modal-content{text-align:center;padding:20px;}
.qr-container{background:var(--c2);border-radius:12px;padding:20px;margin:16px 0;display:inline-block;}
.qr-container canvas,.qr-container img{max-width:200px;height:auto;}
.qr-share-btn{background:var(--or);color:#fff;border:none;padding:10px 20px;border-radius:8px;font-size:12px;font-weight:700;cursor:pointer;margin-top:12px;transition:all .2s;}
.qr-share-btn:hover{background:var(--or2);}
.qr-download-btn{background:var(--gr);color:#000;border:none;padding:10px 20px;border-radius:8px;font-size:12px;font-weight:700;cursor:pointer;margin:12px 6px 0;transition:all .2s;}
.qr-download-btn:hover{background:#00d163;}

/* GPS TRACKING */
.gps-tracking-section{background:var(--c2);border:1px solid var(--bd);border-radius:12px;padding:16px;margin:16px 0;}
.gps-header{display:flex;align-items:center;gap:8px;margin-bottom:12px;font-weight:700;color:var(--bl);}
.gps-status{display:inline-flex;align-items:center;gap:6px;background:rgba(0,153,255,.1);border:1px solid rgba(0,153,255,.3);color:var(--bl);padding:6px 12px;border-radius:6px;font-size:11px;font-weight:700;}
.gps-live-dot{width:8px;height:8px;background:var(--bl);border-radius:50%;animation:blink 1s infinite;}
.gps-info{font-size:12px;color:var(--mt2);line-height:1.6;margin:10px 0;}
.gps-info strong{color:#fff;}
.gps-map-container{height:280px;border-radius:10px;overflow:hidden;margin:12px 0;background:#0D0D0D;position:relative;}
#gps-tracking-map{width:100%;height:100%;}
.gps-driver-info{background:var(--c3);border-left:3px solid var(--or);padding:12px;border-radius:6px;margin:12px 0;font-size:12px;}
.gps-driver-info strong{color:var(--or);}
.gps-coords{font-family:monospace;font-size:10px;color:var(--mt3);margin-top:8px;word-break:break-all;}

/* AVIS CLIENT */
.review-section{background:var(--c1);border:1px solid var(--bd);border-radius:14px;padding:16px;margin:16px 0;}
.review-title{font-family:'Syne',sans-serif;font-size:14px;font-weight:800;color:#fff;margin-bottom:12px;}
.review-rating{display:flex;gap:6px;margin-bottom:12px;font-size:18px;}
.review-rating .star{cursor:pointer;color:var(--mt2);transition:color .2s;}
.review-rating .star.active{color:var(--yw);}
.review-rating .star:hover{color:var(--yw);}
.review-textarea{width:100%;background:var(--dk);border:1px solid var(--bd2);border-radius:10px;padding:10px;color:#fff;font-size:12px;font-family:'DM Sans',sans-serif;min-height:80px;resize:vertical;margin-bottom:12px;outline:none;}
.review-textarea:focus{border-color:var(--or);}
.review-actions{display:flex;gap:8px;flex-wrap:wrap;}
.btn-submit-review{background:var(--or);color:#fff;border:none;padding:10px 16px;border-radius:8px;font-size:12px;font-weight:700;cursor:pointer;transition:all .2s;flex:1;min-width:120px;}
.btn-submit-review:hover{background:var(--or2);}
.btn-submit-review:disabled{opacity:.5;cursor:not-allowed;}
.btn-cancel-review{background:var(--c3);color:var(--mt2);border:1px solid var(--bd2);padding:10px 16px;border-radius:8px;font-size:12px;font-weight:700;cursor:pointer;transition:all .2s;flex:1;min-width:120px;}
.btn-cancel-review:hover{color:#fff;border-color:var(--mt);}
.review-status{background:rgba(0,230,118,.08);border:1px solid rgba(0,230,118,.2);color:var(--gr);padding:10px;border-radius:8px;font-size:12px;text-align:center;font-weight:700;display:none;margin-top:12px;}
.review-status.show{display:block;}
.review-status.error{background:rgba(255,77,0,.08);border-color:rgba(255,77,0,.25);color:var(--or);}
</style>
</head>
<body>
<div id="app">
  <h1>LogiConnect Platform</h1>
  <p>Contenu chargé via JavaScript</p>
</div>

<script>
// ═══════════════════════════════════════════════════════════════════
// 🎯 GESTION QR CODES LIVRAISON & PHOTO PARTAGEABLE
// ═══════════════════════════════════════════════════════════════════

class QRCodeManager {
  static generateDeliveryQR(orderId, deliveryCode) {
    return {
      id: orderId,
      code: deliveryCode,
      timestamp: new Date().toISOString(),
      data: `DELIVERY|${orderId}|${deliveryCode}|${new Date().getTime()}`
    };
  }

  static generatePhotoQR(photoData) {
    return {
      photo: photoData,
      timestamp: new Date().toISOString(),
      data: `PHOTO|${photoData}|${new Date().getTime()}`,
      shareable: true
    };
  }

  static displayQRModal(qrData, type = 'delivery') {
    const modal = document.createElement('div');
    modal.className = 'modal open';
    modal.innerHTML = `
      <div class="mbox" style="max-width: 400px;">
        <button class="mclose">×</button>
        <div class="qr-modal-content">
          <h2 class="mtitle">${type === 'delivery' ? '📦 QR Livraison' : '📸 QR Photo'}</h2>
          <p class="msub">${type === 'delivery' ? 'Validez cette livraison avec votre QR' : 'Partagez cette photo avec le QR'}</p>
          <div class="qr-container" id="qr-target"></div>
          <button class="qr-share-btn" onclick="QRCodeManager.shareQR('${qrData.data}', '${type}')">
            📤 Partager
          </button>
          <button class="qr-download-btn" onclick="QRCodeManager.downloadQR('qr-target', '${type}')">
            ⬇️ Télécharger
          </button>
        </div>
      </div>
    `;
    document.body.appendChild(modal);
    modal.querySelector('.mclose').onclick = () => modal.remove();

    // Générer QR code
    const qrContainer = document.getElementById('qr-target');
    new QRCode(qrContainer, {
      text: qrData.data,
      width: 200,
      height: 200,
      colorDark: '#FF4D00',
      colorLight: '#0D0D0D'
    });
  }

  static shareQR(data, type) {
    if (navigator.share) {
      navigator.share({
        title: type === 'delivery' ? 'QR Livraison' : 'QR Photo',
        text: `${type === 'delivery' ? 'Validez cette livraison' : 'Consultez cette photo'}: ${data}`,
        url: window.location.href
      }).catch(err => console.log('Partage annulé'));
    } else {
      alert('Partage non disponible sur votre appareil');
    }
  }

  static downloadQR(elementId, type) {
    const canvas = document.querySelector(`#${elementId} canvas`);
    if (canvas) {
      const link = document.createElement('a');
      link.href = canvas.toDataURL();
      link.download = `${type}-qr-${Date.now()}.png`;
      link.click();
    }
  }

  static scanQRCode() {
    alert('🎥 Accès caméra pour scanner QR\n\nFonctionnalité intégrée avec jsQR.js');
  }
}

// ═══════════════════════════════════════════════════════════════════
// 📍 GESTION GPS TRACKING EN TEMPS RÉEL
// ═══════════════════════════════════════════════════════════════════

class GPSTracking {
  static orders = {};
  static liveLocation = {};

  static initOrderTracking(orderId, driverId, initialLat, initialLng) {
    this.orders[orderId] = {
      id: orderId,
      driverId: driverId,
      status: 'en_route',
      lastUpdate: new Date(),
      locations: [{ lat: initialLat, lng: initialLng, timestamp: new Date() }]
    };
    this.liveLocation[driverId] = { lat: initialLat, lng: initialLng };
  }

  static updateDriverLocation(driverId, lat, lng) {
    this.liveLocation[driverId] = { lat, lng, timestamp: new Date() };
    
    // Mettre à jour toutes les commandes de ce chauffeur
    Object.values(this.orders).forEach(order => {
      if (order.driverId === driverId) {
        order.locations.push({ lat, lng, timestamp: new Date() });
        order.lastUpdate = new Date();
        this.updateMapMarker(order.id, lat, lng);
      }
    });
  }

  static updateMapMarker(orderId, lat, lng) {
    const mapElement = document.getElementById(`gps-tracking-map-${orderId}`);
    if (mapElement && window.L) {
      if (!this.maps) this.maps = {};
      if (this.maps[orderId]) {
        this.maps[orderId].setView([lat, lng], 15);
        L.circleMarker([lat, lng], {
          radius: 10,
          fillColor: '#FF4D00',
          color: '#fff',
          weight: 2,
          opacity: 1,
          fillOpacity: 0.8
        }).addTo(this.maps[orderId]);
      }
    }
  }

  static displayTrackingInfo(orderId) {
    const order = this.orders[orderId];
    if (!order) return '';

    const lastLocation = order.locations[order.locations.length - 1];
    return `
      <div class="gps-tracking-section">
        <div class="gps-header">
          <span class="gps-status">
            <span class="gps-live-dot"></span>
            En cours de livraison
          </span>
        </div>
        <div class="gps-info">
          <strong>Chauffeur:</strong> ${order.driverId}<br>
          <strong>Dernière mise à jour:</strong> ${order.lastUpdate.toLocaleTimeString()}
        </div>
        <div class="gps-map-container" id="gps-tracking-map-${orderId}"></div>
        <div class="gps-driver-info">
          <strong>📍 Position actuelle</strong><br>
          Latitude: ${lastLocation.lat.toFixed(6)}<br>
          Longitude: ${lastLocation.lng.toFixed(6)}<br>
          <div class="gps-coords">
            ${lastLocation.lat},${lastLocation.lng}
          </div>
        </div>
      </div>
    `;
  }

  static startLiveTracking(orderId) {
    setInterval(() => {
      const order = this.orders[orderId];
      if (order) {
        const lastLoc = order.locations[order.locations.length - 1];
        const newLat = lastLoc.lat + (Math.random() - 0.5) * 0.001;
        const newLng = lastLoc.lng + (Math.random() - 0.5) * 0.001;
        this.updateDriverLocation(order.driverId, newLat, newLng);
      }
    }, 5000);
  }
}

// ═══════════════════════════════════════════════════════════════════
// ⭐ GESTION AVIS CLIENT - SYSTÈME COMPLET
// ═══════════════════════════════════════════════════════════════════

class ReviewSystem {
  static reviews = {};

  static initReviewForm(orderId) {
    return `
      <div class="review-section">
        <div class="review-title">⭐ Donnez votre avis</div>
        
        <div class="review-rating" id="rating-${orderId}">
          <span class="star" data-rating="1">★</span>
          <span class="star" data-rating="2">★</span>
          <span class="star" data-rating="3">★</span>
          <span class="star" data-rating="4">★</span>
          <span class="star" data-rating="5">★</span>
        </div>

        <textarea class="review-textarea" id="comment-${orderId}" placeholder="Vos remarques..."></textarea>

        <div class="review-actions">
          <button class="btn-submit-review" id="submit-${orderId}" onclick="ReviewSystem.submitReview('${orderId}')">
            📤 Envoyer mon avis
          </button>
          <button class="btn-cancel-review" id="cancel-${orderId}" onclick="ReviewSystem.cancelReview('${orderId}')">
            ❌ Annuler mon avis
          </button>
        </div>

        <div class="review-status" id="status-${orderId}"></div>
      </div>
    `;
  }

  static setRating(orderId, rating) {
    const stars = document.querySelectorAll(`#rating-${orderId} .star`);
    stars.forEach((star, idx) => {
      if (idx < rating) {
        star.classList.add('active');
      } else {
        star.classList.remove('active');
      }
    });
    if (!this.reviews[orderId]) this.reviews[orderId] = {};
    this.reviews[orderId].rating = rating;
  }

  static submitReview(orderId) {
    const comment = document.getElementById(`comment-${orderId}`)?.value || '';
    const review = this.reviews[orderId];

    if (!review || !review.rating) {
      this.showStatus(orderId, 'Veuillez sélectionner une note', 'error');
      return;
    }

    this.reviews[orderId] = {
      ...review,
      comment: comment,
      timestamp: new Date(),
      submitted: true
    };

    this.showStatus(orderId, '✅ Avis envoyé avec succès!', 'success');
    
    document.getElementById(`submit-${orderId}`).disabled = true;
    document.getElementById(`comment-${orderId}`).disabled = true;

    console.log('Avis soumis:', this.reviews[orderId]);
  }

  static cancelReview(orderId) {
    if (this.reviews[orderId]?.submitted) {
      this.reviews[orderId] = {};
      this.showStatus(orderId, '❌ Avis annulé', 'error');
      
      document.getElementById(`submit-${orderId}`).disabled = false;
      document.getElementById(`comment-${orderId}`).disabled = false;
      document.getElementById(`comment-${orderId}`).value = '';
      
      document.querySelectorAll(`#rating-${orderId} .star`).forEach(s => s.classList.remove('active'));
    } else {
      this.showStatus(orderId, '⚠️ Aucun avis à annuler', 'error');
    }
  }

  static showStatus(orderId, message, type) {
    const status = document.getElementById(`status-${orderId}`);
    if (status) {
      status.textContent = message;
      status.className = `review-status show ${type === 'error' ? 'error' : ''}`;
      setTimeout(() => {
        status.classList.remove('show');
      }, 4000);
    }
  }
}

console.log('✅ Systèmes LogiConnect chargés:');
console.log('  • QR Code Manager - Livraison & Photo');
console.log('  • GPS Tracking - Suivi en temps réel');
console.log('  • Review System - Avis clients');
</script>
</body>
